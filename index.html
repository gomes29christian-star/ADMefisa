<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clínica Mefisa — Sistema de Gestão e Autorizações</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23002172'/><path d='M30 70 V30 L50 52 L70 30 V70' stroke='%23ffffff' stroke-width='9' stroke-linecap='round' stroke-linejoin='round' fill='none'/><circle cx='50' cy='22' r='6' fill='%2310b981'/></svg>" />
    <meta name="description" content="Plataforma administrativa centralizada para gestão de pacientes, autorizações de convênios, sessões e rastreabilidade da Clínica Mefisa." />
    <meta property="og:title" content="Clínica Mefisa — Sistema de Gestão e Autorizações" />
    <meta property="og:description" content="Plataforma administrativa centralizada para gestão de pacientes, autorizações de convênios, sessões e rastreabilidade da Clínica Mefisa." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Nunito+Sans:ital,opsz,wght@0,6..12,300;0,6..12,400;0,6..12,500;0,6..12,600;0,6..12,700;1,6..12,400&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Polyfills essenciais para execução fora do iframe do AI Studio e compatibilidade ampla
      window.global = window;
      window.process = window.process || { env: {} };
      if (!window.process.env) window.process.env = {};
      window.API_KEY = window.API_KEY || '';
      window.GEMINI_API_KEY = window.GEMINI_API_KEY || '';

      // Polyfill Promise.withResolvers (vital para compatibilidade com navegadores Safari/iOS/antigos)
      if (typeof Promise.withResolvers === 'undefined') {
        Promise.withResolvers = function () {
          var resolve, reject;
          var promise = new Promise(function (res, rej) {
            resolve = res;
            reject = rej;
          });
          return { promise: promise, resolve: resolve, reject: reject };
        };
      }
    </script>
  </head>
  <body class="bg-[#F4F7FB] text-slate-800 antialiased">
    <div id="root">
      <div id="initial-loading-fallback" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F4F7FB;font-family:'Quicksand',sans-serif;color:#002172;">
        <div style="text-align:center;">
          <div style="width:40px;height:40px;border:3px solid #cbd5e1;border-top-color:#002172;border-radius:50%;animation:mefisa-spin 0.8s linear infinite;margin:0 auto 14px auto;"></div>
          <p style="font-weight:700;font-size:13px;color:#002172;">Iniciando Sistema Clínica Mefisa...</p>
        </div>
      </div>
    </div>
    <style>
      @keyframes mefisa-spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      window.__MEFISA_STARTED__ = false;

      function showDiagnosticError(detail) {
        var loader = document.getElementById('initial-loading-fallback');
        if (loader) {
          loader.innerHTML = '<div style="max-width:520px;margin:24px auto;padding:24px;background:#ffffff;border-radius:20px;box-shadow:0 12px 36px rgba(0,0,0,0.12);text-align:center;border:1px solid #fed7aa;font-family:sans-serif;">'
            + '<div style="font-size:32px;margin-bottom:8px;">⚠️</div>'
            + '<h2 style="font-size:16px;font-weight:800;color:#9a3412;margin:0 0 8px 0;">Não foi possível iniciar o sistema</h2>'
            + '<p style="font-size:12px;color:#64748b;margin:0 0 12px 0;">Ocorreu uma falha na execução:</p>'
            + '<div style="background:#fff7ed;color:#c2410c;padding:12px;border-radius:10px;font-family:monospace;font-size:11px;text-align:left;word-break:break-all;max-height:140px;overflow-y:auto;border:1px solid #ffedd5;margin-bottom:16px;">' + detail + '</div>'
            + '<div style="display:flex;gap:8px;justify-content:center;">'
            + '<button onclick="window.location.reload()" style="background:#002172;color:#ffffff;border:none;padding:10px 18px;border-radius:10px;font-weight:700;font-size:12px;cursor:pointer;">Tentar Novamente</button>'
            + '<button onclick="try{localStorage.clear();sessionStorage.clear();}catch(e){}window.location.reload();" style="background:#f1f5f9;color:#334155;border:1px solid #cbd5e1;padding:10px 18px;border-radius:10px;font-weight:600;font-size:12px;cursor:pointer;">Limpar Dados Locais</button>'
            + '</div>'
            + '</div>';
        }
      }

      window.addEventListener('error', function (event) {
        // Ignora erros comuns de extensões de navegador
        if (event && event.filename && (event.filename.indexOf('extension') !== -1 || event.filename.indexOf('chrome-extension') !== -1)) {
          return;
        }
        var msg = (event && (event.message || (event.error && event.error.message))) || 'Erro ao carregar script';
        var src = (event && event.filename) || (event.target && event.target.src) || '';
        showDiagnosticError('Erro de Script: ' + msg + (src ? ' (' + src + ')' : ''));
      }, true);

      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var msg = (reason && (reason.stack || reason.message)) || String(reason);
        if (msg.indexOf('ResizeObserver') !== -1) return;
        showDiagnosticError('Falha Assíncrona: ' + msg);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
